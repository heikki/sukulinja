<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sukulinja</title>
    <script>
      // Apply a pinned appearance before first paint (see appearance.ts).
      document.documentElement.dataset.theme =
        /(?:^|; )sl-appearance=(light|dark)(?:;|$)/u.exec(
          document.cookie
        )?.[1] ?? '';
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./index.js"></script>
  </head>
  <body>
    <sl-app></sl-app>
  </body>
</html>
